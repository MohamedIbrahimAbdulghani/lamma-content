name: lamma_party_game_app
description: "Lamma Party Game App - by Mohamed Ibrahim"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  network_info_plus: ^6.1.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  wakelock_plus: ^1.2.11
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf
          weight: 400
        - asset: assets/fonts/Cairo-VariableFont.ttf
          weight: 600
        - asset: assets/fonts/Cairo-VariableFont.ttf
          weight: 700
