<div class="flex flex-col gap-3 mb-6"><div class="bg-surface-container rounded-[20px] p-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary-container shrink-0"><span class="material-symbols-outlined text-[20px]">quiz</span></div><div class="flex flex-col"><span class="font-body-bold text-body-bold text-white">عدد الأسئلة</span></div></div><div class="flex items-center gap-2" dir="ltr"><button aria-label="تقليل الأسئلة" class="w-11 h-11 rounded-full bg-surface-container-high active:bg-surface-bright flex items-center justify-center text-white transition-colors cursor-pointer select-none" id="btn-q-dec" type="button"><span class="material-symbols-outlined text-[20px]">remove</span></button><span class="w-12 text-center text-[22px] text-primary-container font-bold select-none" id="val-questions">10</span><button aria-label="زيادة الأسئلة" class="w-11 h-11 rounded-full bg-surface-container-high active:bg-surface-bright flex items-center justify-center text-white transition-colors cursor-pointer select-none" id="btn-q-inc" type="button"><span class="material-symbols-outlined text-[20px]">add</span></button></div></div><div class="bg-surface-container rounded-[20px] p-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary-container shrink-0"><span class="material-symbols-outlined text-[20px]">timer</span></div><div class="flex flex-col"><span class="font-body-bold text-body-bold text-white">وقت السؤال</span></div></div><div class="flex items-center gap-2" dir="ltr"><button aria-label="تقليل الوقت" class="w-11 h-11 rounded-full bg-surface-container-high active:bg-surface-bright flex items-center justify-center text-white transition-colors cursor-pointer select-none" id="btn-t-dec" type="button"><span class="material-symbols-outlined text-[20px]">remove</span></button><div class="text-center font-headline-sm text-headline-sm text-primary-container font-bold select-none flex items-center gap-1"><span class="text-[22px] font-bold text-primary-container" id="val-time">15</span><span class="text-label-bold font-label-bold text-[14px]">ثانية</span></div><button aria-label="زيادة الوقت" class="w-11 h-11 rounded-full bg-surface-container-high active:bg-surface-bright flex items-center justify-center text-white transition-colors cursor-pointer select-none" id="btn-t-inc" type="button"><span class="material-symbols-outlined text-[20px]">add</span></button></div></div></div>
<div class="flex flex-col gap-3 mb-6">
<div class="flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-white">الصعوبة</h2>

</div>
<div aria-label="الصعوبة" class="grid grid-cols-4 gap-2" role="radiogroup">
<button class="diff-btn h-11 px-2 rounded-full font-label-bold text-label-bold transition-colors flex items-center justify-center bg-surface-container text-on-surface-variant cursor-pointer" data-diff="easy" type="button">
        سهل
      </button>
<button aria-checked="true" class="diff-btn h-11 px-2 rounded-full font-label-bold text-label-bold transition-colors flex items-center justify-center bg-primary-container text-on-primary cursor-pointer" data-diff="medium" type="button">
        متوسط
      </button>
<button class="diff-btn h-11 px-2 rounded-full font-label-bold text-label-bold transition-colors flex items-center justify-center bg-surface-container text-on-surface-variant cursor-pointer" data-diff="hard" type="button">
        صعب
      </button>
<button class="diff-btn h-11 px-2 rounded-full font-label-bold text-label-bold transition-colors flex items-center justify-center bg-surface-container text-on-surface-variant cursor-pointer" data-diff="mixed" type="button">
        مختلط
      </button>
</div>
</div>
<div class="flex flex-col gap-3 mb-8">
<div class="flex items-center justify-between">
<h2 class="font-headline-sm text-headline-sm text-white">الأقسام</h2>

</div>
<div aria-label="أقسام الأسئلة" class="flex flex-wrap gap-2.5" role="group"><button type="button" class="cat-chip h-11 px-5 rounded-full font-label-bold text-label-bold transition-colors flex items-center gap-2 cursor-pointer bg-primary-container text-[#101428] font-bold" data-selected="true"><span class="material-symbols-outlined text-[20px]">theater_comedy</span><span class="">أفيهات</span></button><button type="button" class="cat-chip h-11 px-5 rounded-full font-label-bold text-label-bold transition-colors flex items-center gap-2 cursor-pointer bg-primary-container text-[#101428] font-bold" data-selected="true"><span class="material-symbols-outlined text-[20px]">sports_soccer</span><span class="">كورة</span></button><button type="button" class="cat-chip h-11 px-5 rounded-full font-label-bold text-label-bold transition-colors flex items-center gap-2 cursor-pointer bg-primary-container text-[#101428] font-bold" data-selected="true"><span class="material-symbols-outlined text-[20px]">sentiment_very_satisfied</span><span class="">نكت</span></button><button type="button" class="cat-chip h-11 px-5 rounded-full font-label-bold text-label-bold transition-colors flex items-center gap-2 cursor-pointer bg-primary-container text-[#101428] font-bold" data-selected="true"><span class="material-symbols-outlined text-[20px]">public</span><span class="">معلومات عامة</span></button><button type="button" class="cat-chip h-11 px-5 rounded-full font-label-bold text-label-bold transition-colors flex items-center gap-2 cursor-pointer bg-primary-container text-[#101428] font-bold" data-selected="true"><span class="material-symbols-outlined text-[20px]">movie</span><span class="">خمّن الفيلم</span></button></div>
</div>
<div class="fixed inset-x-0 bottom-0 z-40 bg-surface/90 backdrop-blur-xl px-margin pb-safe pt-3"><button class="w-full h-14 rounded-full bg-primary-container active:opacity-95 text-on-primary font-body-bold text-[18px] flex items-center justify-center gap-2 transition-transform active:scale-[0.99] cursor-pointer shadow-lg" id="save-lobby-btn" style="background-color: #FFC233; color: #101428;" type="button"><span class="material-symbols-outlined text-[22px]">check_circle</span><span class="">حفظ وارجع للوبي</span></button></div>
</div>
<script>
  (function () {
    let questions = 10;
    let time = 15;

    const qValEl = document.getElementById('val-questions');
    const tValEl = document.getElementById('val-time');
    const catCountEl = document.getElementById('selected-cats-count');

    document.getElementById('btn-q-inc').addEventListener('click', function () {
      if (questions < 30) {
        questions += 5;
        qValEl.textContent = questions;
      }
    });

    document.getElementById('btn-q-dec').addEventListener('click', function () {
      if (questions > 5) {
        questions -= 5;
        qValEl.textContent = questions;
      }
    });

    document.getElementById('btn-t-inc').addEventListener('click', function () {
      if (time < 45) {
        time += 5;
        tValEl.textContent = time;
      }
    });

    document.getElementById('btn-t-dec').addEventListener('click', function () {
      if (time > 10) {
        time -= 5;
        tValEl.textContent = time;
      }
    });

    const diffButtons = document.querySelectorAll('.diff-btn');
    diffButtons.forEach(btn => {
      btn.addEventListener('click', function () {
        diffButtons.forEach(b => {
          b.classList.remove('bg-primary-container', 'text-on-primary');
          b.classList.add('bg-surface-container', 'text-on-surface-variant');
          b.removeAttribute('aria-checked');
        });
        this.classList.remove('bg-surface-container', 'text-on-surface-variant');
        this.classList.add('bg-primary-container', 'text-on-primary');
        this.setAttribute('aria-checked', 'true');
      });
    });

    const catChips = document.querySelectorAll('.cat-chip');
    function updateCatCounter() {
      const selectedCount = document.querySelectorAll('.cat-chip[data-selected="true"]').length;
      catCountEl.textContent = selectedCount + ' أقسام مختارة';
    }

    catChips.forEach(chip => {
      chip.addEventListener('click', function () {
        const isSelected = this.getAttribute('data-selected') === 'true';
        const selectedCount = document.querySelectorAll('.cat-chip[data-selected="true"]').length;

        if (isSelected && selectedCount <= 1) {
          return;
        }

        if (isSelected) {
          this.setAttribute('data-selected', 'false');
          this.classList.remove('bg-primary-container', 'text-on-primary');
          this.classList.add('bg-surface-container', 'text-on-surface-variant');
        } else {
          this.setAttribute('data-selected', 'true');
          this.classList.remove('bg-surface-container', 'text-on-surface-variant');
          this.classList.add('bg-primary-container', 'text-on-primary');
        }
        updateCatCounter();
      });
    });

    document.getElementById('save-lobby-btn').addEventListener('click', function () {
      history.back();
    });
  })();
</script></main>
