<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary": "#402d00", "on-background": "#dee1fd", "on-tertiary": "#690005", "primary-container": "#ffc233", "tertiary-container": "#ffbbb3", "outline-variant": "#4f4534", "tertiary": "#ffe1dd", "inverse-on-surface": "#2b2f45", "surface-container-highest": "#303449", "secondary-container": "#00c298", "on-secondary-container": "#004938", "surface-container-low": "#161a2f", "on-tertiary-fixed": "#410002", "on-secondary-fixed": "#002117", "surface-bright": "#34384e", "tertiary-fixed-dim": "#ffb4ab", "outline": "#9c8f7a", "surface-tint": "#f9bd2d", "primary-fixed": "#ffdea2", "inverse-surface": "#dee1fd", "on-error": "#690005", "inverse-primary": "#7a5900", "on-secondary": "#00382a", "on-surface-variant": "#d3c5ad", "surface-container": "#1a1e33", "on-surface": "#dee1fd", "error-container": "#93000a", "secondary": "#41deb3", "tertiary-fixed": "#ffdad6", "error": "#ffb4ab", "surface-dim": "#0e1226", "on-primary-container": "#6f5100", "background": "#0e1226", "primary-fixed-dim": "#f9bd2d", "on-primary-fixed-variant": "#5c4200", "surface": "#0e1226", "on-tertiary-container": "#a22722", "on-primary-fixed": "#261900", "on-error-container": "#ffdad6", "primary": "#ffe5b6", "secondary-fixed-dim": "#41deb3", "on-tertiary-fixed-variant": "#8c1715", "surface-container-lowest": "#090d21", "secondary-fixed": "#65fbce", "on-secondary-fixed-variant": "#00513e", "surface-container-high": "#25293e", "surface-variant": "#303449" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-xs": "0.5rem", "space-xl": "1.5rem", "gutter": "0.75rem", "margin": "1.5rem", "space-lg": "1.25rem", "space-md": "1rem", "space-sm": "0.75rem" }, fontFamily: { "body-bold": ["Cairo"], "label-bold": ["Cairo"], "headline-lg": ["Cairo"], "body-lg": ["Cairo"], "label-sm": ["Cairo"], "headline-sm": ["Cairo"] }, fontSize: { "body-bold": ["18px", { "lineHeight": "26px", "fontWeight": "700" }], "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary" style="background-color: rgb(16, 20, 40);"><main class="flex flex-col relative w-full px-margin py-6 pb-safe flex-1 justify-center items-center"><div class="flex flex-col w-full h-full flex-1 select-none items-center justify-center">
<!-- Status & Round Header -->

<!-- Primary Interactive Reveal Card -->
<div class="relative w-full flex-1 min-h-[500px] rounded-2xl p-10 flex flex-col items-center justify-center text-center cursor-pointer transition-transform duration-150 active:scale-95 touch-none" id="spyCard" style="background-color: #1B2140;">
<!-- Default Hidden State Content -->
<div class="flex flex-col items-center justify-center transition-opacity duration-200" id="hiddenState">
<!-- Detective Emoji -->
<div class="text-[72px] leading-none mb-6">🕵️</div>
<!-- Main Instruction -->
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-3">
        اضغط واستمر للكشف
      </h2>
<!-- Caution Subtext -->
<p class="font-body-lg text-body-lg text-on-surface-variant text-[18px]">
        ماحدش يشوف شاشتك
      </p>
<!-- Visual Hold Indicator Bar -->
<div class="w-32 h-1.5 bg-surface-container-highest rounded-full mt-8 overflow-hidden">
<div class="h-full bg-tertiary-container w-0 transition-all duration-75" id="holdProgress" style="background-color: rgb(255, 107, 94);"></div>
</div>
</div>
<!-- Revealed Spy Role Content (Toggled during hold) -->
<div class="hidden flex-col items-center justify-center text-center transition-opacity duration-200" id="revealedState"><div class="w-20 h-20 rounded-full flex items-center justify-center mb-6" style="background-color: rgba(255, 107, 94, 0.15); color: rgb(255, 107, 94);"><span class="material-symbols-outlined text-[44px]">visibility</span></div><div class="px-4 py-1.5 rounded-full font-headline-sm text-headline-sm mb-3" style="background-color: rgba(255, 107, 94, 0.2); color: rgb(255, 107, 94);">أنت الجاسوس!</div><p class="font-body-bold text-body-bold text-on-surface max-w-[240px] leading-relaxed">حاول تعرف المكان من أسئلة الباقيين من غير ما يكشفوك!</p><span class="font-label-sm text-label-sm text-on-surface-variant mt-6 text-[14px]">اترك الشاشة لإخفاء الكارت فوراً</span></div>
</div>
<!-- Social Prompt Tip -->

</div>
<script>
  (function () {
    const card = document.getElementById('spyCard');
    const hiddenState = document.getElementById('hiddenState');
    const revealedState = document.getElementById('revealedState');
    const progressBar = document.getElementById('holdProgress');

    let pressTimer = null;
    let progressTimer = null;
    let currentProgress = 0;

    function startPress(e) {
      if (e.cancelable && e.type !== 'touchstart') {
        e.preventDefault();
      }
      currentProgress = 0;
      progressBar.style.width = '0%';
      
      progressTimer = setInterval(() => {
        currentProgress += 10;
        progressBar.style.width = currentProgress + '%';
        if (currentProgress >= 100) {
          clearInterval(progressTimer);
        }
      }, 20);

      pressTimer = setTimeout(() => {
        hiddenState.classList.add('hidden');
        revealedState.classList.remove('hidden');
        revealedState.classList.add('flex');
        if (navigator.vibrate) {
          navigator.vibrate(40);
        }
      }, 200);
    }

    function cancelPress() {
      clearTimeout(pressTimer);
      clearInterval(progressTimer);
      currentProgress = 0;
      progressBar.style.width = '0%';

      revealedState.classList.add('hidden');
      revealedState.classList.remove('flex');
      hiddenState.classList.remove('hidden');
    }

    card.addEventListener('pointerdown', startPress);
    card.addEventListener('pointerup', cancelPress);
    card.addEventListener('pointerleave', cancelPress);
    card.addEventListener('pointercancel', cancelPress);
    card.addEventListener('contextmenu', (e) => e.preventDefault());
  })();
</script></main>



</body></html>
