<script>
  (function() {
    const btn = document.getElementById('start-party-btn');
    if (!btn) return;

    btn.addEventListener('click', () => {
      // Tactile visual feedback on touch/click
      btn.style.transform = 'scale(0.96)';
      setTimeout(() => {
        btn.style.transform = '';
      }, 140);
    });
  })();
