  </head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center gap-space-sm"><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:text-[#FF6B5E] transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="text-[28px] leading-[36px] font-bold text-on-surface truncate">إعدادات مين الجاسوس</h1></div></header><main class="flex flex-col relative w-full px-margin pt-20 pb-28 bg-surface flex-1 overflow-y-auto"><div class="flex flex-col w-full pb-6 select-none" style="padding-bottom: 100px;"><div class="flex flex-col gap-6"><!-- Section 1: خيارات الجولة --><div class="flex flex-col gap-3"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-[#FF6B5E]">tune</span><h2 class="font-headline-sm text-headline-sm text-on-surface">خيارات الجولة</h2></div><div class="flex flex-col gap-3"><!-- Stepper 1: عدد الجولات --><div class="bg-surface-container rounded-[20px] p-4 flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-outline">repeat</span><span class="font-body-bold text-body-bold text-on-surface">عدد الجولات</span></div><div class="flex items-center gap-3"><button aria-label="تقليل الجولات" class="w-11 h-11 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:text-[#FF6B5E]" onclick="updateStepper('stepper-rounds', -1, 1, 10, '')" type="button"><span class="material-symbols-outlined text-[22px]">remove</span></button><span class="w-12 text-center font-headline-sm text-headline-sm text-[#FF6B5E]" data-value="3" id="stepper-rounds">3 ounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:text-[#FF6B5E]" onclick="updateStepper('stepper-vote', -5, 15, 60, ' ثانية')" type="button"><span class="material-symbols-outlined text-[22px]">remove</span></button><span class="min-w-20 text-center font-headline-sm text-headline-sm text-[#FF6B5E] whitespace-nowrap" data-value="30" id="stepper-vote">30 ثانية</span><button aria-label="زيادة وقت التصويت" class="w-11 h-11 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:text-[#FF6B5E]" onclick="updateStepper('stepper-vote', 5, 15, 60, ' ثانية')" type="button"><span class="material-symbols-outlined text-[22px]">add</span></button></div></div><!-- Stepper 4: وقت تخمين الجاسوس --><div class="bg-surface-container rounded-[20px] p-4 flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-outline">psychology</span><span class="font-body-bold text-body-bold text-on-surface">وقت تخمين الجاسوس</span></div><div class="flex items-center gap-3"><button aria-label="تقليل وقت التخمين" class="w-11 h-11 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:text-[#FF6B5E]" onclick="updateStepper('stepper-guess', -5, 10, 45, ' ثانية')" type="button"><span class="material-symbols-outlined text-[22px]">remove</span></button><span class="min-w-20 text-center font-headline-sm text-headline-sm text-[#FF6B5E] whitespace-nowrap" data-value="15" id="stepper-guess">15 ثانية</span><button aria-label="زيادة وقت التخمين" class="w-11 h-11 rounded-full bg-surface-container-lowest text-on-surface flex items-center justify-center active:scale-95 transition-transform hover:text-[#FF6B5E]" onclick="updateStepper('stepper-guess', 5, 10, 45, ' ثانية')" type="button"><span class="material-symbols-outlined text-[22px]">add</span></button></div></div></div></div><!-- Section 2: عدد الجواسيس --><div class="flex flex-col gap-3"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-[#FF6B5E]">theater_comedy</span><h2 class="font-headline-sm text-headline-sm text-on-surface">عدد الجواسيس</h2></div><span class="font-label-sm text-label-sm text-outline">حسب عدد اللاعبين</span></div><div class="grid grid-cols-3 gap-3" id="spy-count-group" role="radiogroup"><button aria-checked="true" class="spy-pill h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-[#FF6B5E] text-[#101428] font-bold" onclick="selectPill(this, 'spy-count-group')" role="radio" type="button">تلقائي</button><button aria-checked="false" class="spy-pill h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-surface-container text-outline" onclick="selectPill(this, 'spy-count-group')" role="radio" type="button">1</button><button aria-checked="false" class="spy-pill h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-surface-container text-outline" onclick="selectPill(this, 'spy-count-group')" role="radio" type="button">2</button></div></div><!-- Section 3: حزمة الكلمات --><div class="flex flex-col gap-3"><div class="flex items-center justify-between"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-[#FF6B5E]">category</span><h2 class="font-headline-sm text-headline-sm text-on-surface">حزمة الكلمات</h2></div></div><div class="flex flex-wrap gap-2" id="words-pack-group" role="radiogroup"><button aria-checked="true" class="pack-pill flex-1 min-w-20 h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-[#FF6B5E] text-[#101428] font-bold" onclick="selectPill(this, 'words-pack-group')" role="radio" type="button">أماكن</button><button aria-checked="false" class="pack-pill flex-1 min-w-20 h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-surface-container text-outline" onclick="selectPill(this, 'words-pack-group')" role="radio" type="button">أفلام</button><button aria-checked="false" class="pack-pill flex-1 min-w-20 h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-surface-container text-outline" onclick="selectPill(this, 'words-pack-group')" role="radio" type="button">أكلات</button><button aria-checked="false" class="pack-pill flex-1 min-w-20 h-12 rounded-full font-label-bold text-label-bold flex items-center justify-center transition-all bg-surface-container text-outline" onclick="selectPill(this, 'words-pack-group')" role="radio" type="button">مختلط</button></div></div></div></div><!-- Fixed Bottom Action Button --><div class="fixed bottom-0 inset-x-0 p-4 pb-safe bg-surface/90 backdrop-blur-md z-40"><button class="w-full h-14 bg-[#FF6B5E] text-[#101428] font-body-bold text-body-bold rounded-full flex items-center justify-center gap-2 active:scale-98 transition-transform font-bold shadow-lg" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">check</span><span class="">حفظ وارجع للوبي</span></button></div><script>function updateStepper(id, change, min, max, unit) { const el = document.getElementById(id); let cur = parseInt(el.getAttribute('data-value'), 10); let next = cur + change; if (next < min) next = min; if (next > max) next = max; el.setAttribute('data-value', next); el.innerText = next + unit; } function selectPill(target, groupId) { const group = document.getElementById(groupId); const pills = group.querySelectorAll('button'); pills.forEach(p => { p.setAttribute('aria-checked', 'false'); p.classList.remove('bg-[#FF6B5E]', 'text-[#101428]', 'font-bold'); p.classList.add('bg-surface-container', 'text-outline'); }); target.setAttribute('aria-checked', 'true'); target.classList.remove('bg-surface-container', 'text-outline'); target.classList.add('bg-[#FF6B5E]', 'text-[#101428]', 'font-bold'); }</script></main>
