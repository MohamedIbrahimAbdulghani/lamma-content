<script>
  function toggleSwitch(btn) {
    const isChecked = btn.getAttribute('aria-checked') === 'true';
    const newState = !isChecked;
    btn.setAttribute('aria-checked', newState);
    
    const knob = btn.querySelector('span');
    if (newState) {
      btn.classList.remove('bg-surface-container-highest');
      btn.classList.add('bg-primary-container');
      knob.classList.remove('translate-x-6', 'bg-on-surface-variant');
      knob.classList.add('translate-x-0', 'bg-surface');
    } else {
      btn.classList.remove('bg-primary-container');
      btn.classList.add('bg-surface-container-highest');
      knob.classList.remove('translate-x-0', 'bg-surface');
      knob.classList.add('translate-x-6', 'bg-on-surface-variant');
    }
  }
</script></main>
