<!DOCTYPE html><html dir="rtl" lang="ar" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary": "#402d00", "on-background": "#dee1fd", "on-tertiary": "#690005", "primary-container": "#ffc233", "tertiary-container": "#ffbbb3", "outline-variant": "#4f4534", "tertiary": "#ffe1dd", "inverse-on-surface": "#2b2f45", "surface-container-highest": "#303449", "secondary-container": "#00c298", "on-secondary-container": "#004938", "surface-container-low": "#161a2f", "on-tertiary-fixed": "#410002", "on-secondary-fixed": "#002117", "surface-bright": "#34384e", "tertiary-fixed-dim": "#ffb4ab", "outline": "#9c8f7a", "surface-tint": "#f9bd2d", "primary-fixed": "#ffdea2", "inverse-surface": "#dee1fd", "on-error": "#690005", "inverse-primary": "#7a5900", "on-secondary": "#00382a", "on-surface-variant": "#d3c5ad", "surface-container": "#1a1e33", "on-surface": "#dee1fd", "error-container": "#93000a", "secondary": "#41deb3", "tertiary-fixed": "#ffdad6", "error": "#ffb4ab", "surface-dim": "#0e1226", "on-primary-container": "#6f5100", "background": "#0e1226", "primary-fixed-dim": "#f9bd2d", "on-primary-fixed-variant": "#5c4200", "surface": "#0e1226", "on-tertiary-container": "#a22722", "on-primary-fixed": "#261900", "on-error-container": "#ffdad6", "primary": "#ffe5b6", "secondary-fixed-dim": "#41deb3", "on-tertiary-fixed-variant": "#8c1715", "surface-container-lowest": "#090d21", "secondary-fixed": "#65fbce", "on-secondary-fixed-variant": "#00513e", "surface-container-high": "#25293e", "surface-variant": "#303449" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-xs": "0.5rem", "space-xl": "1.5rem", "gutter": "0.75rem", "margin": "1.5rem", "space-lg": "1.25rem", "space-md": "1rem", "space-sm": "0.75rem" }, fontFamily: { "body-bold": ["Cairo"], "label-bold": ["Cairo"], "headline-lg": ["Cairo"], "body-lg": ["Cairo"], "label-sm": ["Cairo"], "headline-sm": ["Cairo"] }, fontSize: { "body-bold": ["18px", { "lineHeight": "26px", "fontWeight": "700" }], "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary" style="background-color: rgb(16, 20, 40); color: rgb(222, 225, 253);"><main class="flex flex-col relative w-full px-margin pb-safe bg-surface flex-1 pt-safe overflow-y-auto"><div class="flex flex-col w-full pb-6 select-none pb-24" style="padding-bottom: 110px;">
<div class="flex items-center justify-between mt-2 mb-8"><div class="flex items-center gap-3"><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:text-[#3DDBB0] transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="font-headline-lg text-[28px] font-bold text-on-surface leading-tight">إعدادات مثّل ومتتكلمش</h1></div></div>
<div class="flex flex-col gap-space-sm mb-6">
<div class="bg-surface-container rounded-[20px] p-space-md flex items-center justify-between">
<div class="flex flex-col text-right pr-1">
<span class="font-body-bold text-body-bold text-on-surface">وقت الدور</span>
<span class="font-label-sm text-label-sm text-outline">الوقت المتاح للشرح بالإشارة</span>
</div>
<div class="flex items-center gap-2" dir="ltr"><button id="btn-time-minus" type="button" class="w-11 h-11 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-bright active:scale-95 transition-all"><span class="material-symbols-outlined text-[20px]">remove</span></button><span class="w-24 text-center font-headline-sm text-[22px] font-bold text-[#3DDBB0]" id="label-time">60 ثانية</span><button id="btn-time-plus" type="button" class="w-11 h-11 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-bright active:scale-95 transition-all"><span class="material-symbols-outlined text-[20px]">add</span></button></div>
</div>
<div class="bg-surface-container rounded-[20px] p-space-md flex items-center justify-between">
<div class="flex flex-col text-right pr-1">
<span class="font-body-bold text-body-bold text-on-surface">عدد الأدوار لكل لاعب</span>
<span class="font-label-sm text-label-sm text-outline">مرات التمثيل المتاحة لكل فرد</span>
</div>
<div class="flex items-center gap-2" dir="ltr"><button id="btn-rounds-minus" type="button" class="w-11 h-11 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-bright active:scale-95 transition-all"><span class="material-symbols-outlined text-[20px]">remove</span></button><span class="w-12 text-center font-headline-sm text-[22px] font-bold text-[#3DDBB0]" id="label-rounds">2</span><button id="btn-rounds-plus" type="button" class="w-11 h-11 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center hover:bg-surface-bright active:scale-95 transition-all"><span class="material-symbols-outlined text-[20px]">add</span></button></div>
</div>
</div>
<div class="flex flex-col mb-8">
<div class="flex items-center justify-between mb-3 px-1">
<h3 class="font-headline-sm text-headline-sm text-on-surface">قسم الكلمات</h3>
<span class="font-label-sm text-label-sm text-outline">اختر فئة التحدي</span>
</div>
<div class="flex flex-wrap gap-3" id="categories-container"><button type="button" data-category="movies" class="category-pill h-12 px-6 rounded-full bg-[#3DDBB0] text-[#101428] font-body-bold text-body-bold flex items-center justify-center gap-2 transition-all active:scale-[0.98]"><span class="material-symbols-outlined text-[20px]">movie</span><span class="">أفلام</span></button><button type="button" data-category="jobs" class="category-pill h-12 px-6 rounded-full bg-transparent border border-outline/40 text-on-surface font-body-bold text-body-bold flex items-center justify-center gap-2 transition-all active:scale-[0.98]"><span class="material-symbols-outlined text-[20px]">engineering</span><span class="">مهن</span></button><button type="button" data-category="verbs" class="category-pill h-12 px-6 rounded-full bg-transparent border border-outline/40 text-on-surface font-body-bold text-body-bold flex items-center justify-center gap-2 transition-all active:scale-[0.98]"><span class="material-symbols-outlined text-[20px]">directions_run</span><span class="">أفعال</span></button><button type="button" data-category="mix" class="category-pill h-12 px-6 rounded-full bg-transparent border border-outline/40 text-on-surface font-body-bold text-body-bold flex items-center justify-center gap-2 transition-all active:scale-[0.98]"><span class="material-symbols-outlined text-[20px]">shuffle</span><span class="">مختلط</span></button></div>
</div>

<div class="fixed inset-x-0 bottom-0 p-4 pb-safe bg-surface/90 backdrop-blur-md z-40 flex justify-center"><button class="w-full max-w-md h-[56px] rounded-full bg-[#3DDBB0] text-[#101428] font-body-bold text-[18px] flex items-center justify-center gap-2 shadow-none active:scale-[0.98] transition-transform font-bold" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">check_circle</span><span class="">حفظ وارجع للوبي</span></button></div>
</div>
<script>
  (function() {
    let currentTime = 60;
    let currentRounds = 2;

    const timeLabel = document.getElementById('label-time');
    const roundsLabel = document.getElementById('label-rounds');

    document.getElementById('btn-time-minus')?.addEventListener('click', () => {
      if (currentTime > 30) {
        currentTime -= 15;
        timeLabel.textContent = `${currentTime} ثانية`;
      }
    });

    document.getElementById('btn-time-plus')?.addEventListener('click', () => {
      if (currentTime < 180) {
        currentTime += 15;
        timeLabel.textContent = `${currentTime} ثانية`;
      }
    });

    document.getElementById('btn-rounds-minus')?.addEventListener('click', () => {
      if (currentRounds > 1) {
        currentRounds -= 1;
        roundsLabel.textContent = currentRounds.toString();
      }
    });

    document.getElementById('btn-rounds-plus')?.addEventListener('click', () => {
      if (currentRounds < 10) {
        currentRounds += 1;
        roundsLabel.textContent = currentRounds.toString();
      }
    });

    const categoryButtons = document.querySelectorAll('.category-pill');
    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => {
          b.className = 'category-pill h-14 px-4 rounded-full bg-surface-container text-outline font-body-bold text-body-bold flex items-center justify-center gap-2 transition-all active:scale-98';
        });
        btn.className = 'category-pill h-14 px-4 rounded-full bg-secondary text-surface font-body-bold text-body-bold flex items-center justify-center gap-2 transition-all active:scale-98';
      });
    });
  })();
</script></main>



</body></html>
