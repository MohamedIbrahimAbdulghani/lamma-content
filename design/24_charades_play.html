  </head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><main class="flex flex-col relative w-full min-h-screen px-margin py-space-xl pb-safe bg-[#101428] flex-1 justify-between select-none"><div class="flex flex-col w-full flex-1 justify-between items-center py-space-md"><div class="w-full flex justify-center pt-space-md"><span class="text-[#3DDBB0] font-bold tracking-wider tabular-nums text-headline-lg" id="game-timer">0:42</span></div><div class="flex flex-1 items-center justify-center w-full"><h1 class="text-white text-[72px] font-bold text-center leading-none tracking-tight select-none" id="current-word">الفرح</h1></div><div class="w-full flex items-center gap-space-md max-w-sm pb-space-md"><button class="h-14 flex-1 bg-[#3DDBB0] text-[#101428] font-bold text-[18px] flex items-center justify-center gap-2 active:scale-95 transition-transform" id="btn-correct" type="button" style="border-radius: 16px;"><span class="">✔</span><span class="">صح</span></button><button class="h-14 flex-1 border-2 border-[#A9B0CC] text-white font-bold text-[18px] flex items-center justify-center active:scale-95 transition-transform" id="btn-skip" type="button" style="border-radius: 16px;"><span class="">تخطّي</span></button></div></div>
<script>
  (() => {
    const words = [
      { text: "الفرح", category: "أفلام 🎬", hint: "كلمة واحدة" },
      { text: "الكيف", category: "أفلام 🎬", hint: "كلمة واحدة" },
      { text: "إبراهيم الأبيض", category: "أفلام 🎬", hint: "كلمتين" },
      { text: "الناظر", category: "أفلام 🎬", hint: "كلمة واحدة" },
      { text: "صعيدي في الجامعة الأمريكية", category: "أفلام 🎬", hint: "أربع كلمات" },
      { text: "عسل أسود", category: "أفلام 🎬", hint: "كلمتين" }
    ];

    let currentIndex = 0;
    let score = 3;
    let timeLeft = 42;

    const timerEl = document.getElementById("game-timer");
    const wordEl = document.getElementById("current-word");
    const scoreEl = document.getElementById("score-counter");
    const wordCard = document.getElementById("word-card");
    const btnCorrect = document.getElementById("btn-correct");
    const btnSkip = document.getElementById("btn-skip");

    // Countdown interval
    const timerInterval = setInterval(() => {
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        return;
      }
      timeLeft -= 1;
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      timerEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }, 1000);

    const advanceWord = (isSuccess) => {
      currentIndex = (currentIndex + 1) % words.length;
      
      // Visual response on card
      wordCard.style.transform = isSuccess ? "translateY(-4px)" : "translateY(4px)";
      setTimeout(() => {
        wordCard.style.transform = "none";
      }, 150);

      wordEl.textContent = words[currentIndex].text;

      if (isSuccess) {
        score += 1;
        scoreEl.textContent = score;
      }
    };

    btnCorrect?.addEventListener("click", () => advanceWord(true));
    btnSkip?.addEventListener("click", () => advanceWord(false));
  })();
</script></main>
