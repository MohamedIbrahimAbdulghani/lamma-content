<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-primary": "#402d00", "on-background": "#dee1fd", "on-tertiary": "#690005", "primary-container": "#ffc233", "tertiary-container": "#ffbbb3", "outline-variant": "#4f4534", "tertiary": "#ffe1dd", "inverse-on-surface": "#2b2f45", "surface-container-highest": "#303449", "secondary-container": "#00c298", "on-secondary-container": "#004938", "surface-container-low": "#161a2f", "on-tertiary-fixed": "#410002", "on-secondary-fixed": "#002117", "surface-bright": "#34384e", "tertiary-fixed-dim": "#ffb4ab", "outline": "#9c8f7a", "surface-tint": "#f9bd2d", "primary-fixed": "#ffdea2", "inverse-surface": "#dee1fd", "on-error": "#690005", "inverse-primary": "#7a5900", "on-secondary": "#00382a", "on-surface-variant": "#d3c5ad", "surface-container": "#1a1e33", "on-surface": "#dee1fd", "error-container": "#93000a", "secondary": "#41deb3", "tertiary-fixed": "#ffdad6", "error": "#ffb4ab", "surface-dim": "#0e1226", "on-primary-container": "#6f5100", "background": "#0e1226", "primary-fixed-dim": "#f9bd2d", "on-primary-fixed-variant": "#5c4200", "surface": "#0e1226", "on-tertiary-container": "#a22722", "on-primary-fixed": "#261900", "on-error-container": "#ffdad6", "primary": "#ffe5b6", "secondary-fixed-dim": "#41deb3", "on-tertiary-fixed-variant": "#8c1715", "surface-container-lowest": "#090d21", "secondary-fixed": "#65fbce", "on-secondary-fixed-variant": "#00513e", "surface-container-high": "#25293e", "surface-variant": "#303449" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-xs": "0.5rem", "space-xl": "1.5rem", "gutter": "0.75rem", "margin": "1.5rem", "space-lg": "1.25rem", "space-md": "1rem", "space-sm": "0.75rem" }, fontFamily: { "body-bold": ["Cairo"], "label-bold": ["Cairo"], "headline-lg": ["Cairo"], "body-lg": ["Cairo"], "label-sm": ["Cairo"], "headline-sm": ["Cairo"] }, fontSize: { "body-bold": ["18px", { "lineHeight": "26px", "fontWeight": "700" }], "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }], "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }], "label-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><main class="flex flex-col relative w-full px-margin pb-safe bg-surface flex-1 pt-4"><div class="flex flex-col w-full pb-6">
<!-- Screen Header (In-game voting screen) -->
<div class="flex items-center justify-between mb-6"><h1 class="font-headline-lg text-headline-lg text-on-surface">مين الجاسوس؟</h1><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:text-primary transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button></div>
<!-- Players Voting List -->
<fieldset aria-label="قائمة التصويت على الجاسوس" class="flex flex-col gap-3 m-0 p-0 border-0" role="radiogroup">
<!-- Player 1 -->
<label class="player-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container cursor-pointer transition-colors select-none" data-player-id="1">
<input class="sr-only" name="spy_vote" type="radio" value="ahmed">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-xl shrink-0">
          🦁
        </div>
<span class="font-body-bold text-body-bold text-on-surface">أحمد</span>
</div>
<div class="indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<!-- Player 2 (Default Selected: سارة) -->
<label class="player-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container cursor-pointer transition-colors select-none ring-2 ring-[#FF6B5E]" data-player-id="2">
<input checked="" class="sr-only" name="spy_vote" type="radio" value="sara">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-[#FF6B5E]/20 flex items-center justify-center text-xl shrink-0">
          🦊
        </div>
<div class="flex flex-col items-start">
<span class="font-body-bold text-body-bold text-on-surface">سارة</span>

</div>
</div>
<div class="indicator w-6 h-6 rounded-full bg-[#FF6B5E] text-[#101428] flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<!-- Player 3 -->
<label class="player-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container cursor-pointer transition-colors select-none" data-player-id="3">
<input class="sr-only" name="spy_vote" type="radio" value="karim">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-xl shrink-0">
          🐻
        </div>
<span class="font-body-bold text-body-bold text-on-surface">كريم</span>
</div>
<div class="indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<!-- Player 4 -->
<label class="player-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container cursor-pointer transition-colors select-none" data-player-id="4">
<input class="sr-only" name="spy_vote" type="radio" value="nour">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-xl shrink-0">
          🐼
        </div>
<span class="font-body-bold text-body-bold text-on-surface">نور</span>
</div>
<div class="indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<!-- Player 5 -->
<label class="player-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container cursor-pointer transition-resp select-none" data-player-id="5">
<input class="sr-only" name="spy_vote" type="radio" value="omar">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-xl shrink-0">
          🐯
        </div>
<span class="font-body-bold text-body-bold text-on-surface">عمر</span>
</div>
<div class="indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
<!-- Player 6 -->
<label class="player-card relative flex items-center justify-between p-4 rounded-lg bg-surface-container cursor-pointer transition-colors select-none" data-player-id="6">
<input class="sr-only" name="spy_vote" type="radio" value="yasmin">
<div class="flex items-center gap-3">
<div class="w-11 h-11 rounded-full bg-surface-container-highest flex items-center justify-center text-xl shrink-0">
          🐨
        </div>
<span class="font-body-bold text-body-bold text-on-surface">ياسمين</span>
</div>
<div class="indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[18px] font-bold">check</span>
</div>
</label>
</fieldset>
<!-- Sticky Bottom Actions -->
<div class="mt-8 pt-4">
<button class="w-full h-14 rounded-full bg-[#FF6B5E] text-[#101428] font-body-bold text-body-bold flex items-center justify-center gap-2 active:opacity-90 transition-opacity focus:outline-none" id="confirm-vote-btn" type="button">
<span class="material-symbols-outlined text-[22px]">how_to_vote</span>
<span class="">أكّد صوتي</span>
</button>
</div>
</div>
<script>
  (function() {
    const cards = document.querySelectorAll('.player-card');
    const confirmBtn = document.getElementById('confirm-vote-btn');

    cards.forEach(card => {
      const radio = card.querySelector('input[type="radio"]');

      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.classList.remove('ring-2', 'ring-[#FF6B5E]');
          const ind = c.querySelector('.indicator');
          if (ind) {
            ind.classList.remove('bg-[#FF6B5E]', 'text-[#101428]');
            ind.classList.add('bg-surface-container-highest', 'text-transparent');
          }
          const sub = c.querySelector('.text-\\[\\#FF6B5E\\]');
          if (sub) sub.remove();
        });

        radio.checked = true;
        card.classList.add('ring-2', 'ring-[#FF6B5E]');
        
        const indicator = card.querySelector('.indicator');
        if (indicator) {
          indicator.classList.remove('bg-surface-container-highest', 'text-transparent');
          indicator.classList.add('bg-[#FF6B5E]', 'text-[#101428]');
        }

        const nameContainer = card.querySelector('.font-body-bold').parentElement;
        if (!nameContainer.querySelector('.text-\\[\\#FF6B5E\\]')) {
          const badge = document.createElement('span');
          badge.className = 'text-[12px] font-bold text-[#FF6B5E] leading-none mt-0.5';
          badge.textContent = 'اختيارك الحالي';
          nameContainer.appendChild(badge);
        }
      });
    });

    confirmBtn.addEventListener('click', () => {
      const selected = document.querySelector('input[name="spy_vote"]:checked');
      if (selected) {
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>تم تسجيل الصوت!</span>';
      }
    });

    // Countdown mock
    let seconds = 45;
    const timerEl = document.getElementById('vote-timer');
    if (timerEl) {
      const interval = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(interval);
          timerEl.textContent = '00:00';
        } else {
          timerEl.textContent = `00:${seconds < 10 ? '0' : ''}${seconds}`;
        }
      }, 1000);
    }
  })();
</script></main>

</body></html>
