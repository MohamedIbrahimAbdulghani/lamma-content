  </head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary" style="background-color: rgb(16, 20, 40);"><main class="flex flex-col relative w-full px-margin pt-6 pb-safe flex-1"><div class="flex flex-col w-full pb-8 select-none"><!-- Top row: سؤال 3 من 10 and circular timer 12 in #FFC233 -->
<div class="flex items-center justify-between w-full mb-8 pt-2">
  <span class="font-headline-sm text-[20px] text-on-surface font-bold">سؤال 3 من 10</span>
  <div class="relative w-14 h-14 flex items-center justify-center shrink-0">
    <svg class="w-full h-full -rotate-90" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#1B2140" stroke-width="3.5"></circle>
      <circle cx="24" cy="24" r="20" fill="none" stroke="#FFC233" stroke-width="3.5" stroke-dasharray="125.6" stroke-dashoffset="25.12" stroke-linecap="round"></circle>
    </svg>
    <div class="absolute inset-0 flex items-center justify-center">
      <span class="font-headline-sm text-[18px] text-[#FFC233] font-bold tabular-nums">12</span>
    </div>
  </div>
</div>

<!-- Question text in 28px bold -->
<div class="w-full mb-8">
  <h1 class="text-[28px] font-bold text-on-surface leading-snug text-right m-0">
    مين صاحب الإفيه الشهير: يا صفيحة زبالة منورة؟
  </h1>
</div>

<!-- Four full-width answer cards -->
<div class="flex flex-col gap-3.5 w-full">
  <div class="w-full p-4 rounded-[16px] flex items-center text-right text-on-surface text-[18px] font-bold" style="background-color: #1B2140; border: 1px solid #30385E;">
    عادل إمام
  </div>
  <div class="w-full p-4 rounded-[16px] flex items-center text-right text-on-surface text-[18px] font-bold" style="background-color: #1B2140; border: 1px solid #30385E;">
    محمد هنيدي
  </div>
  <div class="w-full p-4 rounded-[16px] flex items-center text-right text-on-surface text-[18px] font-bold" style="background-color: #1B2140; border: 1px solid #30385E;">
    أحمد حلمي
  </div>
  <div class="w-full p-4 rounded-[16px] flex items-center text-right text-on-surface text-[18px] font-bold" style="background-color: #1B2140; border: 1px solid #30385E;">
    نجيب الريحاني
  </div>
</div></div>
<script>
  (function () {
    const options = document.querySelectorAll('.trivia-option');
    const timerNum = document.getElementById('timer-num');
    const timerRing = document.getElementById('timer-ring');
    const feedbackBox = document.getElementById('feedback-state');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackPoints = document.getElementById('feedback-points');

    let answered = false;
    let timeLeft = 12;
    const totalTime = 15;
    const circumference = 2 * Math.PI * 20;

    const interval = setInterval(() => {
      if (answered) {
        clearInterval(interval);
        return;
      }
      if (timeLeft > 0) {
        timeLeft--;
        if (timerNum) timerNum.textContent = timeLeft;
        if (timerRing) {
          const offset = circumference * (1 - (timeLeft / totalTime));
          timerRing.style.strokeDashoffset = offset;
        }
      } else {
        clearInterval(interval);
        revealAnswers(null);
      }
    }, 1000);

    function revealAnswers(selectedBtn) {
      if (answered) return;
      answered = true;
      clearInterval(interval);

      options.forEach(btn => {
        btn.disabled = true;
        btn.classList.remove('active:scale-[0.99]');
        const isCorrect = btn.dataset.correct === 'true';
        const isSelected = btn === selectedBtn;
        const icon = btn.querySelector('.option-icon');
        const badge = btn.querySelector('.option-badge');
        const text = btn.querySelector('.option-text');

        if (isCorrect) {
          btn.style.outline = 'none';
          btn.classList.remove('bg-surface-container', 'text-on-surface');
          btn.classList.add('bg-secondary', 'text-on-secondary');
          if (badge) {
            badge.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
            badge.classList.add('bg-on-secondary/15', 'text-on-secondary');
          }
          if (text) {
            text.classList.remove('text-on-surface');
            text.classList.add('text-on-secondary');
          }
          if (icon) {
            icon.textContent = 'check_circle';
            icon.classList.remove('opacity-0');
            icon.classList.add('opacity-100', 'text-on-secondary');
          }
        } else if (isSelected) {
          btn.style.outline = 'none';
          btn.classList.remove('bg-surface-container', 'text-on-surface');
          btn.classList.add('bg-error', 'text-on-error');
          if (badge) {
            badge.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
            badge.classList.add('bg-on-error/15', 'text-on-error');
          }
          if (text) {
            text.classList.remove('text-on-surface');
            text.classList.add('text-on-error');
          }
          if (icon) {
            icon.textContent = 'cancel';
            icon.classList.remove('opacity-0');
            icon.classList.add('opacity-100', 'text-on-error');
          }
        } else {
          btn.style.opacity = '0.5';
        }
      });

      if (feedbackBox) {
        feedbackBox.classList.remove('hidden');
        feedbackBox.classList.add('flex');
        const isSelectedCorrect = selectedBtn && selectedBtn.dataset.correct === 'true';

        if (isSelectedCorrect) {
          feedbackBox.classList.add('bg-secondary', 'text-on-secondary');
          feedbackTitle.textContent = 'جدع! إجابة صحيحة';
          feedbackIcon.textContent = 'sentiment_very_satisfied';
          feedbackPoints.textContent = '+50';
        } else {
          feedbackBox.classList.add('bg-error', 'text-on-error');
          feedbackTitle.textContent = selectedBtn ? 'للأسف! إجابة غلط' : 'الوقت خلص!';
          feedbackIcon.textContent = 'sentiment_dissatisfied';
          feedbackPoints.textContent = '0';
        }
      }
    }

    options.forEach(btn => {
      btn.addEventListener('click', () => {
        revealAnswers(btn);
      });
    });
  })();
</script></main>
