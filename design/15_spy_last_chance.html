    body {

  </head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary" style="background-color: rgb(16, 20, 40); color: rgb(255, 255, 255);"><main class="flex flex-col relative w-full px-margin pb-safe bg-surface flex-1 pt-safe"><div class="flex flex-col w-full pb-space-lg select-none"><!-- Top navigation with clean back arrow -->
<div class="flex items-center justify-start w-full pt-space-md mb-space-md">
  <button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center rounded-full text-white hover:text-[#FF6B5E] transition-colors" onclick="history.back()" type="button">
    <span class="material-symbols-outlined text-[28px]">arrow_forward</span>
  </button>
</div>

<!-- Prominent Screen Title -->
<div class="w-full text-right mb-space-lg">
  <h1 class="text-[28px] font-bold text-white leading-tight">اتكشفت! خمّن الكلمة</h1>
</div>

<!-- Countdown Timer Module in clean circle with coral #FF6B5E border -->
<div class="flex flex-col items-center justify-center w-full my-space-md">
  <div class="relative w-44 h-44 flex items-center justify-center bg-[#1B2140] rounded-full border-4 border-[#FF6B5E]/30">
    <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
      <circle cx="50" cy="50" fill="transparent" r="42" stroke="#1B2140" stroke-width="5"></circle>
      <circle class="transition-all duration-1000 ease-linear" cx="50" cy="50" fill="transparent" id="timer-ring" r="42" stroke="#FF6B5E" stroke-dasharray="263.89" stroke-dashoffset="0" stroke-linecap="round" stroke-width="5" style="stroke-dashoffset: 276.46;"></circle>
    </svg>
    <div class="flex flex-col items-center justify-center z-10">
      <span class="text-[48px] leading-none font-bold text-[#FF6B5E]" id="countdown-val">15</span>
      <span class="text-[14px] font-bold text-[#A9B0CC] mt-1">ثانية</span>
    </div>
  </div>
</div>

<!-- Four full-width word buttons with #1B2140 background and 2px #A9B0CC outline -->
<div class="flex flex-col w-full mt-space-lg" id="options-group">
  <button class="w-full h-[56px] mb-3 px-space-md bg-[#1B2140] border-2 border-[#A9B0CC] rounded-2xl flex items-center justify-center active:scale-[0.98] transition-all hover:border-[#FF6B5E]" onclick="selectWord(this, false)" type="button">
    <span class="text-[18px] font-bold text-white text-center truncate">محطة مصر</span>
  </button>
  <button class="w-full h-[56px] mb-3 px-space-md bg-[#1B2140] border-2 border-[#A9B0CC] rounded-2xl flex items-center justify-center active:scale-[0.98] transition-all hover:border-[#FF6B5E]" onclick="selectWord(this, true)" type="button">
    <span class="text-[18px] font-bold text-white text-center truncate">مطار القاهرة</span>
  </button>
  <button class="w-full h-[56px] mb-3 px-space-md bg-[#1B2140] border-2 border-[#A9B0CC] rounded-2xl flex items-center justify-center active:scale-[0.98] transition-all hover:border-[#FF6B5E]" onclick="selectWord(this, false)" type="button">
    <span class="text-[18px] font-bold text-white text-center truncate">برج الجيزة</span>
  </button>
  <button class="w-full h-[56px] mb-3 px-space-md bg-[#1B2140] border-2 border-[#A9B0CC] rounded-2xl flex items-center justify-center active:scale-[0.98] transition-all hover:border-[#FF6B5E]" onclick="selectWord(this, false)" type="button">
    <span class="text-[18px] font-bold text-white text-center truncate">شاطئ المعمورة</span>
  </button>
</div></div>
<script>
  let timeLeft = 15;
  const initialOffset = 0;
  const circumference = 276.46;
  const timerValElem = document.getElementById('countdown-val');
  const ringElem = document.getElementById('timer-ring');
  let answered = false;

  const timerInterval = setInterval(() => {
    if (answered) {
      clearInterval(timerInterval);
      return;
    }
    timeLeft--;
    if (timeLeft >= 0) {
      timerValElem.textContent = timeLeft;
      const progress = (15 - timeLeft) / 15;
      ringElem.style.strokeDashoffset = progress * circumference;
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      handleTimeout();
    }
  }, 1000);

  function selectWord(buttonEl, isCorrect) {
    if (answered) return;
    answered = true;
    clearInterval(timerInterval);

    const container = document.getElementById('options-group');
    const buttons = container.querySelectorAll('button');

    buttons.forEach(btn => {
      btn.disabled = true;
      btn.classList.add('opacity-40');
      btn.classList.remove('active:scale-[0.98]');
    });

    buttonEl.classList.remove('opacity-40', 'bg-surface-container');
    const span = buttonEl.querySelector('span');

    if (isCorrect) {
      buttonEl.classList.add('bg-secondary-container');
      span.classList.remove('text-on-surface');
      span.classList.add('text-on-secondary-container');
    } else {
      buttonEl.classList.add('bg-error');
      span.classList.remove('text-on-surface');
      span.classList.add('text-on-error');
    }
  }

  function handleTimeout() {
    if (answered) return;
    answered = true;
    const container = document.getElementById('options-group');
    const buttons = container.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.disabled = true;
      btn.classList.add('opacity-40');
    });
    timerValElem.classList.add('animate-pulse');
  }
</script></main>





</body></html>
