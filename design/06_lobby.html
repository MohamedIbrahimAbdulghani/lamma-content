  </head><body class="bg-surface font-body-lg text-body-lg text-on-surface flex flex-col min-h-screen selection:bg-primary selection:text-on-primary"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="رجوع" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:text-primary transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="font-headline-lg text-headline-lg text-on-surface font-bold truncate">اللوبي</h1></div></div></header><main class="flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface flex-1"><div class="flex flex-col w-full pb-6 space-y-6 select-none">
<!-- Top Bar: Room Code & Status Info -->
<div class="flex items-center justify-between gap-3">
<!-- Room Code Chip -->
<div class="flex items-center gap-2 bg-surface-container px-4 py-2 rounded-[16px]">
<span class="material-symbols-outlined text-primary-container text-[20px]">tag</span>
<span class="font-headline-sm text-[16px] leading-[24px] font-bold text-primary-container tracking-wider">كود الغرفة: 5824</span>
<button aria-label="نسخ الكود" class="flex items-center justify-center p-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-transform" onclick="navigator.clipboard?.writeText('5824')" type="button">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
</button>
</div>
<!-- Active Players Count Pill -->

</div>
<!-- Players Section -->
<div class="flex flex-col space-y-3">
<div class="flex items-center justify-between">
<span class="font-headline-sm text-headline-sm text-on-surface">الصحبة في اللوبي</span>

</div>
<!-- 2x3 Players Grid -->
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Player 1 (Host) -->
<div class="relative bg-surface-container rounded-[20px] p-4 flex flex-col items-center justify-center text-center group">
<div class="relative w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-[26px] mb-2 shrink-0">
          🦁
          <!-- Host Crown Badge -->
<div class="absolute -top-1.5 -left-1.5 w-6 h-6 rounded-full bg-primary-container text-on-primary flex items-center justify-center text-[14px] font-bold shadow-none">👑</div>
</div>
<div class="flex items-center gap-1 max-w-full">
<span class="font-body-bold text-[16px] leading-[24px] text-on-surface truncate">أحمد</span>

</div>
</div>
<!-- Player 2 -->
<div class="bg-surface-container rounded-[20px] p-4 flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-[26px] mb-2 shrink-0">
          🦊
        </div>
<span class="font-body-bold text-[16px] leading-[24px] text-on-surface truncate max-w-full">سارة</span>
</div>
<!-- Player 3 -->
<div class="bg-surface-container rounded-[20px] p-4 flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-[26px] mb-2 shrink-0">
          🐻
        </div>
<span class="font-body-bold text-[16px] leading-[24px] text-on-surface truncate max-w-full">كريم</span>
</div>
<!-- Player 4 -->
<div class="bg-surface-container rounded-[20px] p-4 flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-[26px] mb-2 shrink-0">
          🐼
        </div>
<span class="font-body-bold text-[16px] leading-[24px] text-on-surface truncate max-w-full">نور</span>
</div>
<!-- Player 5 -->
<div class="bg-surface-container rounded-[20px] p-4 flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-[26px] mb-2 shrink-0">
          🐯
        </div>
<span class="font-body-bold text-[16px] leading-[24px] text-on-surface truncate max-w-full">عمر</span>
</div>
<!-- Player 6 -->
<div class="bg-surface-container rounded-[20px] p-4 flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-[26px] mb-2 shrink-0">
          🐨
        </div>
<span class="font-body-bold text-[16px] leading-[24px] text-on-surface truncate max-w-full">ياسمين</span>
</div>
</div>
</div>
<!-- Game Selection Section -->
<div class="flex flex-col space-y-2.5">
<div class="flex items-center justify-between">
<span class="font-label-bold text-label-bold text-on-surface">اختر نوع اللعبة</span>

</div>
<!-- Selectable Pills (Horizontal Scroll/Stack) -->
<div class="flex flex-wrap items-center gap-2" id="game-pills">
<button class="game-pill h-[44px] px-4 rounded-[22px] bg-primary-container text-on-primary font-headline-sm text-[15px] font-bold shrink-0 flex items-center justify-center transition-colors" onclick="selectGame(this)" type="button">
        مين الجاسوس
      </button>
<button class="game-pill h-[44px] px-4 rounded-[22px] bg-surface-container text-on-surface border-2 border-outline-variant font-headline-sm text-[15px] font-bold shrink-0 flex items-center justify-center transition-colors hover:border-outline" onclick="selectGame(this)" type="button">
        تحدي الشلة
      </button>
<button class="game-pill h-[44px] px-4 rounded-[22px] bg-surface-container text-on-surface border-2 border-outline-variant font-headline-sm text-[15px] font-bold shrink-0 flex items-center justify-center transition-colors hover:border-outline" onclick="selectGame(this)" type="button">
        مثّل ومتتكلمش
      </button>
</div>
</div>
<!-- Actions Area -->
<div class="flex flex-col space-y-3 pt-2">
<!-- Secondary Button: إعدادات اللعبة -->
<button class="w-full h-[56px] rounded-full bg-transparent border-2 border-outline-variant text-on-surface font-body-bold text-body-bold flex items-center justify-center gap-2 active:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">tune</span>
<span class="">إعدادات اللعبة</span>
</button>
<!-- Primary Button: ابدأ اللعبة -->
<button class="w-full h-[56px] rounded-full bg-primary-container text-on-primary font-body-bold text-body-bold flex items-center justify-center gap-2 active:opacity-95 transition-opacity" type="button">
<span class="material-symbols-outlined text-[24px]">play_arrow</span>
<span class="">ابدأ اللعبة</span>
</button>
</div>
<!-- Footer -->
<div class="w-full pt-2 flex items-center justify-center">
<span class="font-label-sm text-label-sm text-outline tracking-wider">Mohamed Ibrahim</span>
</div>
</div>
<script>
  function selectGame(button) {
    const pills = document.querySelectorAll('.game-pill');
    pills.forEach(pill => {
      pill.classList.remove('bg-primary-container', 'text-on-primary');
      pill.classList.add('bg-surface-container', 'text-on-surface', 'border-2', 'border-outline-variant');
    });
    button.classList.remove('bg-surface-container', 'text-on-surface', 'border-2', 'border-outline-variant');
    button.classList.add('bg-primary-container', 'text-on-primary');
  }
</script></main>

</body></html>
